
<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Mobile responsiveness -->

        name="viewport"

    <meta
        name="description"
        content="Ignis Fatuus — an interactive story experience."
    >

    <title>Ignis Fatuus</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Main menu styles -->
<link rel="stylesheet" href="mainmenu.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=UnifrakturCook:wght@700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >
</head>

 <body>
  <main class="menu-screen">
    <nav class="menu-actions" aria-label="Main menu">


  <span class="corner top-left"></span>
  <span class="corner top-right"></span>
  <span class="corner bottom-left"></span>
  <span class="corner bottom-right"></span>

  <h1 class="game-title">Ignis Fatuus</h1>

  <a class="btn" href="premise.html">Premise</a>
  <a class="btn" href="prologue.html">New Journey Here!</a>
  <a class="btn" href="archive.html">Character Archive</a>
  <a class="btn" href="credits.html">Credits</a>


<div class="utility-buttons">
  <button
    class="icon-btn"
    id="settingsBtn"
    type="button"
    aria-label="Open settings"
    title="Settings">
    <i class="fa-solid fa-gear" aria-hidden="true"></i>
  </button>

  <button
    class="icon-btn"
    id="tutorialBtn"
    type="button"
    aria-label="Open tutorial"
    title="Tutorial">
    <i class="fa-solid fa-question" aria-hidden="true"></i>
  </button>
</div>

<dialog class="game-dialog" id="gameDialog">
  <button
    class="dialog-close"
    id="closeDialog"
    type="button"
    aria-label="Close dialog">×</button>

  <div id="dialogContent"></div>
</dialog>

<script src="script.js"></script>

</nav>

  </main>
</body>
</html>
