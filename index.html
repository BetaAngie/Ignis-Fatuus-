<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Mobile responsiveness -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Ignis Fatuus — an interactive story experience."
    >

    <title>Ignis Fatuus</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=UnifrakturCook:wght@700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >
</head>

<body>

    <main class="menu-screen">

        <nav class="menu-actions" aria-label="Main menu">

            <!-- Decorative corners -->
            <span class="corner top-left" aria-hidden="true"></span>
            <span class="corner top-right" aria-hidden="true"></span>
            <span class="corner bottom-left" aria-hidden="true"></span>
            <span class="corner bottom-right" aria-hidden="true"></span>

            <!-- Title -->
            <h1 class="game-title">Ignis Fatuus</h1>

            <!-- Main menu -->
            <div class="main-buttons">

              <!-- Add HTML -->
                <a
                    class="btn"
                    href=
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Premise
                </a>

              <!-- Add HTML with Premise Information -->
                <a
                    class="btn"
                    href=" " 
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    New Journey Here!
                </a>
              
                <a
                    class="btn"
                    href="#credits"
                >
                    Credits
                </a>
            </div>

            <!-- Utility buttons -->
            <div class="utility-buttons">

                <button
                    type="button"
                    class="icon-btn"
                    id="settings-btn"
                    aria-label="Open settings"
                    title="Settings"
                >
                    <i class="fa-solid fa-gear" aria-hidden="true"></i>
                </button>

                <button
                    type="button"
                    class="icon-btn"
                    id="tutorial-btn"
                    aria-label="Open tutorial"
                    title="Tutorial"
                >
                    <i class="fa-solid fa-question" aria-hidden="true"></i>
                </button>
            </div>
        </nav>
    </main>

    <!-- Credits section -->
    <section id="credits" class="credits" aria-label="Credits">
        <h2>Credits</h2>
        <p>Ignis Fatuus</p>
    </section>

</body>
</html>
