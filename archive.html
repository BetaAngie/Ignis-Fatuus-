<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive | Ignis Fatuus</title>
    <link rel="stylesheet" href="style.css">
</head>


<section class="evidence-panel">
    <h2>Recovered Evidence</h2>
    <p>Three records have been recovered. Inspect each one.</p>

    <button class="evidence-card" data-clue="one">
        Evidence 01 — The Clock
    </button>

    <p id="clue-one" hidden>
        The clock stopped at 08:15.
    </p>

    <button class="evidence-card" data-clue="two">
        Evidence 02 — The Report
    </button>

    <p id="clue-two" hidden>
        The report was signed at 08:15.
    </p>

    <button class="evidence-card" data-clue="three">
        Evidence 03 — The Recording
    </button>

    <p id="clue-three" hidden>
        The recording begins at 08:15.
    </p>

    <form id="puzzle-form">
        <label for="puzzle-answer">
            What time appears in all three records?
        </label>

        <input
            id="puzzle-answer"
            name="answer"
            type="text"
            placeholder="Enter your answer"
            autocomplete="off"
            required>

        <button type="submit">Submit Answer</button>
    </form>

    <p id="puzzle-feedback" aria-live="polite"></p>
    <p id="secret-message" hidden>
        FILE UNLOCKED: You found the first inconsistency.
    </p>
</section>

<script src="archive.js"></script>
