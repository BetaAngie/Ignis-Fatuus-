<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive | Ignis Fatuus</title>
    <link rel="stylesheet" href="style.css">
</head>


<main class="story-panel">
    <p id="scene-label">RECOVERED RECORD // 001</p>

    <p id="story-text" aria-live="polite">
        The screen flickers to life. A message appears:
        "If you can read this, the system has not failed completely."
    </p>

    <div id="story-choices" class="story-choices">
        <button data-choice="inspect">Inspect the terminal</button>
        <button data-choice="call">Call out into the darkness</button>
        <button data-choice="wait">Remain silent</button>
    </div>

    <p id="story-feedback" aria-live="polite"></p>
    <button id="restart-story" hidden>Restart scene</button>
</main>

<script src="prologue.js"></script>
